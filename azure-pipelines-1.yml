trigger:
- main

pool:
  name: Default

variables:
  solution: '**/*.sln'
  buildConfiguration: 'Release'

stages:

# ==============================
# BUILD STAGE (CI)
# ==============================
- stage: Build
  displayName: Build Application
  jobs:
  - job: BuildJob
    steps:

    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      inputs:
        configuration: '$(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish Web API
      inputs:
        command: publish
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'

#    - task: ArchiveFiles@2
#      inputs:
#        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
#       includeRootFolder: false
#        archiveType: zip
#        archiveFile: '$(Build.ArtifactStagingDirectory)/artifact/app.zip'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/artifact'
        ArtifactName: drop

# ==============================
# DEPLOY TO DEV
# ==============================
- stage: Deploy_Dev
  displayName: Deploy to Dev
  dependsOn: Build
  jobs:
  - deployment: DeployDev
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'action-filters-api'
              appType: webApp
              appName: 'ActionFilterAPI'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              deploymentMethod: zipDeploy

# ==============================
# DEPLOY TO QA
# ==============================
- stage: Deploy_QA
  displayName: Deploy to QA
  dependsOn: Deploy_Dev
  jobs:
  - deployment: DeployQA
    environment: qa
    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'action-filters-api'
              appType: webApp
              appName: 'ActionFilterAPI'
              package: '$(Pipeline.Workspace)/drop/*.zip'

# ==============================
# DEPLOY TO PRODUCTION
# ==============================
- stage: Deploy_Prod
  displayName: Deploy to Production
  dependsOn: Deploy_QA
  jobs:
  - deployment: DeployProd
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'action-filters-api'
              appType: webApp
              appName: 'ActionFilterAPI'
              package: '$(Pipeline.Workspace)/drop/*.zip'